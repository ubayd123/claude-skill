# Self-hosted stack: the website + PostgreSQL. Put Caddy/Nginx (or a platform load balancer) in front for HTTPS.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rltc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rltc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rltc"], interval: 10s, retries: 5 }
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://rltc:${POSTGRES_PASSWORD}@db:5432/rltc
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    volumes: [files:/data]
volumes:
  pgdata:
  files:
